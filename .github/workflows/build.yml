name: Build Edition Home TV

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Java 8 (exigido pelo Gradle 5 / AGP 3.6)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Android SDK (platform 25 e build-tools)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-25" "build-tools;28.0.3"

      - name: Gradle 5.6.4
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-5.6.4-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-5.6.4/bin" >> "$GITHUB_PATH"

      - name: Compilar APK de debug
        run: gradle --no-daemon assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Edition-Home-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
